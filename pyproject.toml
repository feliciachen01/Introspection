[project]
name = "introspect"
version = "0.1.0"
description = "Can open LLMs notice their own thoughts? An open replication of concept-injection introspection tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.30",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
introspect = "introspect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
